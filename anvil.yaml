allow_embedding: false
db_schema:
  orders:
    client: none
    columns:
    - admin_ui: {order: 0}
      name: order_number
      type: string
    - admin_ui: {order: 1}
      name: order_date
      type: datetime
    - admin_ui: {order: 2}
      name: status
      type: string
    - admin_ui: {order: 3}
      name: total
      type: number
    - admin_ui: {order: 4}
      name: coupons
      type: simpleObject
    server: full
    title: Orders
  sage_order_accounts:
    client: none
    columns:
    - admin_ui: {order: 0}
      name: order_number
      type: string
    - admin_ui: {order: 1}
      name: account_code
      type: string
    - admin_ui: {order: 2}
      name: customer_name
      type: string
    server: full
    title: Sage Order Accounts
  users:
    client: none
    columns:
    - admin_ui: {order: 0}
      name: email
      type: string
    - admin_ui: {order: 1}
      name: enabled
      type: bool
    - admin_ui: {order: 2}
      name: signed_up
      type: datetime
    - admin_ui: {order: 3}
      name: password_hash
      type: string
    - admin_ui: {order: 4}
      name: confirmed_email
      type: bool
    - admin_ui: {order: 5}
      name: remembered_logins
      type: simpleObject
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 7, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    server: full
    title: Users
name: Minimal Theme 2
package_name: Minimal_Theme_2
runtime_options:
  client_version: '3'
  server_spec: {base: python310-minimal}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- server_config: {}
  source: /runtime/services/uplink.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: false, remember_me_days: 30, require_secure_passwords: true, use_email: true}
  server_config:
    email_content:
      reset_password:
        html: |-
          <p>Hi there,</p>
          <p>You have requested a password reset for your account {{email}}. To reset your password, click the link below:</p>
          <p>{{reset_link}}</p>
          <p>This link will expire in ten minutes.</p>
    user_table: users
  source: /runtime/services/anvil/users.yml
startup: {module: Form1, type: form}
uplink_visible: true
