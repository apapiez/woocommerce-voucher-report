<anvil-form layout="Minimal_Theme_2.Layouts.BaseLayout">
    <anvil-block slot="actions">
        <anvil-component type="Link" name="home_link" prop:text="Home"></anvil-component>
    </anvil-block>
    <anvil-block slot="content">
        <anvil-component type="ColumnPanel" name="column_panel_1" prop:role="card">
            <anvil-component type="Label" name="lede_label" prop:role="lede" prop:text="Select a WooCommerce order export CSV (Order, Date, Status, Coupons Used, Total columns) to import."></anvil-component>
            <anvil-component type="FileLoader" name="file_loader" prop:file_types=".csv" prop:text="Choose CSV file"></anvil-component>
            <anvil-component type="Button" name="import_button" prop:text="Import orders" prop:enabled="false"></anvil-component>
            <anvil-component type="Label" name="result_label" prop:visible="false"></anvil-component>
            <anvil-component type="RepeatingPanel" name="errors_panel" prop:item_template="Minimal_Theme_2.ImportErrorRow" prop:visible="false"></anvil-component>
        </anvil-component>
    </anvil-block>
    <anvil-block slot="title">
        <anvil-component type="Label" name="label_1" prop:role="h1" prop:text="Upload orders CSV"></anvil-component>
    </anvil-block>
</anvil-form>
