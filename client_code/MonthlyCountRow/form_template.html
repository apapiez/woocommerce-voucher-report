<div class="month-card">
  <anvil-component type="Label" name="month_label" prop:role="eyebrow" bind:text="self.item['month_label']"></anvil-component>
  <anvil-component type="Plot" name="chart"></anvil-component>
  <div class="month-table-scroll">
    <anvil-component type="RepeatingPanel" name="users_panel" prop:item_template="Minimal_Theme_2.FirstTimeUserRow" bind:items="self.item['users']"></anvil-component>
  </div>
  <anvil-component type="Label" name="total_label" bind:text="'Total owing: ' + self.item['total_owing_display']"></anvil-component>
</div>
